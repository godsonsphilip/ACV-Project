# AeroScapes Semantic Segmentation Experiment Configuration
# Baseline (Model A: No Skips) vs Controlled Change (Model B: Skip Connections)

experiment:
  project_name: "aeroscapes_segmentation"
  seeds: [42, 123, 456]
  default_seed: 42
  device: "cuda"  # falls back to "cpu" if cuda unavailable

dataset:
  name: "aeroscapes"
  raw_dir: "Dataset"
  image_dir: "Dataset"
  mask_dir: "Dataset/preprocessed_masks"  # generated by preprocess_dataset.py
  splits_dir: "splits"
  num_classes: 12
  ignore_index: 255  # pixels with no valid label (if any)
  classes:
    - "background"
    - "person"
    - "bike"
    - "car"
    - "drone"
    - "boat"
    - "animal"
    - "obstacle"
    - "construction"
    - "vegetation"
    - "road"
    - "sky"
  image_height: 256
  image_width: 384
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  horizontal_flip_prob: 0.5
  scale_range: [0.8, 1.2]
  crop_size: [256, 384]
  color_jitter:
    brightness: 0.15
    contrast: 0.15
    saturation: 0.15
    hue: 0.05

model:
  in_channels: 3
  encoder_channels: [32, 64, 128, 256]
  bottleneck_channels: 512

training:
  batch_size: 8
  num_workers: 2
  epochs: 35
  smoke_epochs: 1
  smoke_samples: 20
  lr: 0.001
  weight_decay: 0.0001
  warmup_epochs: 3
  early_stopping_patience: 10
  use_amp: true
  loss_type: "unweighted"  # "unweighted" or "class_weighted"

colab:
  drive_mount_path: "/content/drive"
  checkpoint_drive_dir: "/content/drive/MyDrive/aeroscapes_checkpoints"

